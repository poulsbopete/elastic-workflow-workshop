# Instruqt Track: Negative Review Campaign Detection (Serverless Elasticsearch)
#
# Sandbox matches elastic-autonomous-observability:
#   https://play.instruqt.com/manage/elastic/tracks/elastic-autonomous-observability
#
# - Host: es3-api (image elastic/es3-api-v2)
# - Secret: ESS_CLOUD_API_KEY (Elastic Cloud API key for es3-api provisioning)
# - track_scripts/setup-es3-api creates a Serverless *Elasticsearch* project, nginx
#   proxies Kibana → :8080 and Elasticsearch → :9200, then loads workshop data.
#
# Service tabs (align naming with elastic-autonomous-observability):
#   - Elastic Serverless → es3-api:8080 + /app/dashboards (nginx → Cloud UI, Basic auth injected)
#   - ElasticEats / Attack → es3-api:8000 (FastAPI)
#

slug: review-bomb-workshop-serverless
# Remote Instruqt track id (must match platform or push fails with "Entity already exists")
id: 6cqqeywqqnqc
type: track
title: Negative Review Campaign Detection (Serverless)
teaser: Detect and respond to review bombs using ES|QL, Workflows, and Agent Builder on Elastic Serverless
description: |
  In this hands-on workshop, you'll build an automated detection and response system
  to protect businesses from coordinated negative review campaigns (review bombs),
  using **Elastic Cloud Serverless (Elasticsearch)**.

  The lab environment is provisioned the same way as **Elastic Autonomous Observability**:
  an `es3-api` host creates your Serverless project and nginx exposes the Elastic UI (Kibana) and Elasticsearch.

  You'll learn how to:
  - Write detection queries using ES|QL and LOOKUP JOIN
  - Build automated workflows for real-time response
  - Create investigation tools with Agent Builder
  - Run an end-to-end attack simulation

icon: https://www.elastic.co/favicon.ico
tags:
  - elasticsearch
  - kibana
  - esql
  - workflows
  - agent-builder
  - serverless
  - security
  - fraud-detection
  - co.elastic.workshops

owner: elastic
developers:
  - workshop@elastic.co
  - peter.simkins@elastic.co

private: false
published: false
show_timer: true
skipping_enabled: true
idle_timeout: 3600
timelimit: 10800

lab_config:
  overlay: false
  width: 33
  position: right
  extend_ttl: 3600
  feedback_recap_enabled: false
  sidebar_enabled: true
  feedback_tab_enabled: false
  # Rotating tips on the loading bar (optional); notes carousel is the main wait UX below
  loadingMessages: true
  theme:
    name: modern-dark
  override_challenge_layout: false
  hideStopButton: false

# Loading experience: match [elastic-autonomous-observability](https://play.instruqt.com/manage/elastic/tracks/elastic-autonomous-observability)
# and Instruqt "Notes only" — https://docs.instruqt.com/tracks/manage/loading-experience
# false = learners see challenge **notes** as slides while the sandbox loads (no early assignment/tabs).
# true ("Full access") shows assignment + tabs with generic per-tab messages ("coffee" style), which we avoid here.
enhanced_loading: false

# Challenge `id` values MUST match Instruqt’s platform IDs (opaque strings). If you see
# “Failed to fetch status” / “Entity not found” on the loading carousel, run:
#   instruqt track pull elastic/review-bomb-workshop-serverless --force
# and copy `id:` from each pulled assignment.md frontmatter into this file, then push.
challenges:
  - slug: getting-to-know-your-data
    id: xv8yiwtyngcd
    type: challenge
    title: Getting to Know Your Data
    teaser: Explore the review platform data and write detection queries
    assignment: challenges/01-getting-to-know-your-data/assignment.md
    notes:
      - type: text
        contents: |
          # Welcome to the Negative Review Campaign Detection Workshop (Serverless)!

          Your **Serverless Elasticsearch** project is provisioned on the **`es3-api`** host
          (same pattern as **Elastic Autonomous Observability**). Open the **Elastic Serverless** tab (port **8080**,
          nginx proxy to the cloud — dashboards list). Workshop data is loaded via the bulk API.

          ## What You'll Build
          - Detection queries with **ES|QL**
          - Automated **Workflows**
          - **Agent Builder** investigation tools

          Use the note carousel while the environment finishes loading.
      - type: text
        contents: |
          # Hang tight — finishing provisioning

          Track setup is:

          - Creating your **Serverless Elasticsearch** project (`es3-api.py`)
          - Starting **nginx** (Elastic UI **:8080**, Elasticsearch **:9200** on the VM)
          - Creating indices and **bulk-loading** businesses, users, and reviews
          - Starting **ElasticEats** on **:8000**

          **Typical wait: 1–3 minutes.** Swipe or use the dots to read the next tips.
      - type: text
        contents: |
          # While you wait: ES|QL teaser

          **Example:** count reviewers with low trust scores:

          ```
          FROM users
          | WHERE trust_score < 0.3
          | STATS c = COUNT(*)
          ```

          You'll combine this with **LOOKUP JOIN** and business context in the assignment.
      - type: text
        contents: |
          # What to open when ready

          1. **ElasticEats** — consumer UI over the same data you'll query.
          2. **Elastic Serverless** — ES|QL, Discover, Workflows, Agent Builder (**:8080**).
          3. **Terminal** — optional shell and scripts.

          Use the **note slides** (dots or swipe) while the environment finishes loading.
    tabs:
      - title: Elastic Serverless
        type: service
        hostname: es3-api
        port: 8080
        path: "/app/dashboards#/list?_g=(filters:!(),refreshInterval:(pause:!t,value:60000),time:(from:now-15m,to:now))"
      - title: Terminal
        type: terminal
        hostname: es3-api
      - title: ElasticEats
        type: service
        hostname: es3-api
        port: 8000
    difficulty: basic
    timelimit: 900

