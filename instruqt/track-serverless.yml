slug: review-bomb-workshop-serverless
# Remote Instruqt track id (must match platform or push fails with "Entity already exists")
id: 6cqqeywqqnqc
type: track
title: Negative Review Campaign Detection (Serverless)
teaser: Detect and respond to review bombs using ES|QL, Workflows, and Agent Builder on Elastic Serverless
description: |
  In this hands-on workshop, you'll build an automated detection and response system
  to protect businesses from coordinated negative review campaigns (review bombs),
  using **Elastic Cloud Serverless (Elasticsearch)**.

  The lab environment is provisioned the same way as **Elastic Autonomous Observability**:
  an `es3-api` host creates your Serverless project and nginx exposes the Elastic UI (Kibana) and Elasticsearch.

  You'll learn how to:
  - Write detection queries using ES|QL and LOOKUP JOIN
  - Build automated workflows for real-time response
  - Create investigation tools with Agent Builder
  - Run an end-to-end attack simulation

