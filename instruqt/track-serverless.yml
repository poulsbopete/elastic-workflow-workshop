# Instruqt Track: Negative Review Campaign Detection (Serverless Search)
#
# Runs the same workshop as the main track but against Elastic Cloud
# Serverless (search), using https://play.instruqt.com/manage/elastic/tracks/elastic-autonomous-observability
# as the environment base (connection + single host).
#
# Differences from the ECK/snapshot track:
#   - No kubernetes-vm; no snapshot restore. Data is loaded via bulk API.
#   - Authentication: API key only (ELASTICSEARCH_API_KEY).
#   - Indices created with Serverless-compatible settings (no number_of_shards).
#   - Track/challenge setup runs on host-1 only (see startup-serverless.sh).
#

slug: review-bomb-workshop-serverless
id: review-bomb-workshop-serverless
type: track
title: Negative Review Campaign Detection (Serverless)
teaser: Detect and respond to review bombs using ES|QL, Workflows, and Agent Builder on Elastic Serverless
description: |
  In this hands-on workshop, you'll build an automated detection and response system
  to protect businesses from coordinated negative review campaigns (review bombs),
  using **Elastic Cloud Serverless (search)**.

  You'll learn how to:
  - Write detection queries using ES|QL and LOOKUP JOIN
  - Build automated workflows for real-time response
  - Create investigation tools with Agent Builder
  - Run an end-to-end attack simulation

  This track uses the same content as the main workshop but runs against
  a Serverless project (no snapshot restore; data is loaded via API).

icon: https://www.elastic.co/favicon.ico
tags:
  - elasticsearch
  - kibana
  - esql
  - workflows
  - agent-builder
  - serverless
  - security
  - fraud-detection

owner: elastic
developers:
  - workshop@elastic.co

private: false
published: false
show_timer: true
skipping_enabled: true

lab_config:
  overlay: false
  width: 33
  position: right
  extend_ttl: 0
  feedback_recap_enabled: false

