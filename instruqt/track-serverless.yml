challenges:
  - slug: getting-to-know-your-data
    id: xv8yiwtyngcd
    type: challenge
    title: Getting to Know Your Data
    teaser: Explore the review platform data and write detection queries
    assignment: challenges/01-getting-to-know-your-data/assignment.md
    notes:
      - type: text
        contents: |
          # Welcome — Negative Review Campaign Detection (Serverless)

          Your **Serverless Elasticsearch** project is provisioned on **`es3-api`** (same pattern as **Elastic Autonomous Observability**). Use the **Elastic Serverless** tab on **:8080** (dashboards open via nginx). Data is **bulk-loaded** when setup completes.

          **[What's New in Elastic Search 9.3 — full slide deck (HTML)](https://poulsbopete.github.io/elastic-workflow-workshop/slides/whats-new-elastic-search-9.3.html)** — same narrative as this carousel; open in another tab if you prefer fullscreen slides.

          Swipe the dots below for **workshop agenda, philosophy, and lab preview** while the environment loads.
      - type: text
        contents: |
          # What's New in Elastic Search 9.3 — workshop agenda

          | Theme | Capability | Outcome |
          |-------|------------|---------|
          | **Simplify** | ES\|QL · LOOKUP JOIN · Workflows | Readable queries · One query vs many API calls · Visual automation |
          | **Optimize** | Inference / native automation | Less external glue |
          | **Innovate with AI** | Agent Builder · semantic search | Ask in English · search by meaning |

          From multiple API calls → **single-query efficiency**  
          From complex external tools → **native automation**  
          From keyword matching → **semantic understanding**
      - type: text
        contents: |
          # Today's core philosophy

          > **Search** finds the insight.  
          > **Workflows** act on it.  
          > **Agent Builder** explains it.

          - **Simplify:** ES|QL + Workflows  
          - **Optimize:** automated response  
          - **Innovate with AI:** natural-language investigation

          **Format:** four sections × two parts — short **presentation** (~5 min each) + **workshop** hands-on (~10 min each).
      - type: text
        contents: |
          # The challenge: review bombing

          **Review bombing** — coordinated fake negative reviews to hurt reputation (restaurants, e‑commerce, apps, B2B reviews).

          **Why it matters:** platform churn, **~5–9% revenue loss** per 1-star drop, scale that **manual triage** cannot match.

          **Your journey in this lab**
          1. **Detection** — correlate reviews with **user trust scores** (ES|QL)  
          2. **Workflow** — scheduled run (~5 min) → hold + protect + **incidents**  
          3. **AI investigation** — **Agent Builder** tools  
          4. **Simulation** — attack → detect → respond → resolve
      - type: text
        contents: |
          # Know your data (Challenge 1 preview)

          **Yelp-style sample (lab scale):** businesses, users, reviews — plus **`incidents`** and **`notifications`**.

          **Trust score (examples)**  
          - **Low** (&lt; 0.3) — newer / suspicious accounts  
          - **High** (&gt; 0.7) — established contributors  

          **Challenge 1 focus:** data model, trust patterns, **semantic search**, **LOOKUP JOIN** — write ES|QL to spot coordinated low-trust bursts.

          **Mission:** detect a review bomb → contain it automatically → narrate the incident with AI tools.
      - type: text
        contents: |
          # Simplify detection — ES|QL & LOOKUP JOIN

          **ES|QL** uses **pipes** so analysts read a clear, linear flow — not only search experts.

          **LOOKUP JOIN:** **one query** ties reviews to **user reputation** (and businesses) without round-tripping through your app for every enrichment.

          *(You’ll experiment in the assignment right after the lab finishes loading.)*
      - type: text
        contents: |
          # Later challenges (preview)

          | # | Theme | You’ll do |
          |---|--------|-----------|
          | **2** | **Workflows** | Scheduled detection, actions (hold reviews, **incidents**) |
          | **3** | **Agent Builder** | Tools + agent grounded in your indices — investigate in plain English |
          | **4** | **End-to-end** | ElasticEats → launch attack → watch workflow → investigate → resolve |

          > Search finds. Workflows act. Agent Builder explains.
      - type: text
        contents: |
          # Hang tight — finishing provisioning

          Track setup is:

          - Creating your **Serverless Elasticsearch** project (`es3-api.py`)
          - Starting **nginx** (Elastic UI **:8080**, Elasticsearch **:9200** on the VM)
          - Creating indices and **bulk-loading** businesses, users, and reviews
          - Starting **ElasticEats** on **:8000**

          **Typical wait: 1–3 minutes.** Keep swiping for the ES|QL tip and tab list.
      - type: text
        contents: |
          # While you wait: ES|QL teaser

          **Example:** count reviewers with low trust scores:

          ```
          FROM users
          | WHERE trust_score < 0.3
          | STATS c = COUNT(*)
          ```

          You'll combine this with **LOOKUP JOIN** and business context in the assignment.
      - type: text
        contents: |
          # What to open when ready

          1. **ElasticEats** — consumer UI over the same data you'll query.
          2. **Elastic Serverless** — ES|QL, Discover, Workflows, Agent Builder (**:8080**).
          3. **Terminal** — optional shell and scripts.

          **Deck:** [What's New in Elastic Search 9.3 (HTML)](https://poulsbopete.github.io/elastic-workflow-workshop/slides/whats-new-elastic-search-9.3.html)
