# Same sandbox pattern as elastic-autonomous-observability and
# review-bomb-workshop-serverless: elastic/es3-api-v2 + ESS_CLOUD_API_KEY + LLM_PROXY_PROD.
# Hostname "elastic" matches track.yml service tabs; track_scripts/setup-elastic
# provisions Serverless Elasticsearch + nginx (:8080 Kibana, :9200 ES) + workshop app.
#
# NOTE: This replaces the old ubuntu-2004 image (Instruqt push: "image not found").
#
version: "3"

virtualmachines:
  - name: elastic
    image: elastic/es3-api-v2
    shell: /bin/bash
    environment:
      PROJECT_TYPE: elasticsearch
      OPTIMIZED_FOR: general_purpose
      REGIONS: aws-us-east-1
    memory: 12288
    cpus: 4
    allow_external_ingress:
      - http
      - https
      - high-ports

secrets:
  - name: ESS_CLOUD_API_KEY
  - name: LLM_PROXY_PROD
