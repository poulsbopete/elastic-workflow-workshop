# Instruqt Track Configuration
# Negative Review Campaign Detection Workshop

slug: review-bomb-workshop
id: 6rnaaq5ozjng
type: track
title: Negative Review Campaign Detection with Elastic Workflows
teaser: Learn to detect and respond to coordinated review attacks using ES|QL, Workflows, and Agent Builder
description: |
  In this hands-on workshop, you'll build an automated detection and response system
  to protect businesses from coordinated negative review campaigns (review bombs).

  You'll learn how to:
  - Write detection queries using ES|QL and LOOKUP JOIN
  - Build automated workflows for real-time response
  - Create investigation tools with Agent Builder
  - Run an end-to-end attack simulation

  This workshop demonstrates patterns applicable to fraud detection, security operations,
  and compliance monitoring.

  **Sandbox:** Serverless Elasticsearch via `elastic/es3-api-v2` (same as Autonomous Observability).
  Kibana opens on port **8080** (nginx proxy). For a dedicated Serverless track slug, see
  `review-bomb-workshop-serverless`.

