    type: challenge
    title: Getting to Know Your Data
    teaser: Explore the review platform data and write detection queries
    assignment: challenges/01-getting-to-know-your-data/assignment.md
    notes:
      - type: text
        contents: |
          # Welcome to the Negative Review Campaign Detection Workshop!

          In this workshop, you'll learn how to detect and respond to
          coordinated negative review campaigns (review bombs) using Elastic's powerful
          data analysis and automation tools.

          ## What You'll Build
          - Detection queries with ES|QL
          - Automated response workflows
          - AI-powered investigation tools

          Let's get started!
      - type: text
        contents: |
          # Hang tight — we're provisioning your lab

          Behind the scenes we're:

          - Creating your **Elastic Cloud Serverless (Elasticsearch)** project
          - Connecting **Kibana** and **Elasticsearch** through a secure proxy
          - Loading the **ElasticEats** sample dataset (businesses, users, reviews)
          - Starting the **workshop web app** for the consumer-style UI

          **This usually takes 1–3 minutes.** Use the arrows or dots above to read the next tips while you wait.
      - type: text
        contents: |
          # While you wait: ES|QL in one line

          ES|QL lets analysts work in a **pipe-style** language directly on Elasticsearch — no JSON query DSL required for many tasks.

          **Example:** count reviewers with low trust scores:

          ```
          FROM users
          | WHERE trust_score < 0.3
          | STATS c = COUNT(*)
          ```

          You'll use patterns like this in the assignment to find coordinated behavior.
      - type: text
        contents: |
          # What to open first

          When the lab is ready:

          1. **ElasticEats** — browse the fictional restaurant site (same data you'll query).
          2. **Kibana** — run ES|QL in Discover or Dev Tools (**port 8080** in this lab).
          3. **Terminal** — optional shell for scripts and `curl`.

          Flip through these notes anytime during loading — they rotate automatically when **Loading messages** are enabled.
