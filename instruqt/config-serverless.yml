# Reference copy — canonical Serverless track sandbox lives in:
#   instruqt/review-bomb-workshop-serverless/config.yml
#
# Based on elastic-autonomous-observability (es3-api-v2 + ESS_CLOUD_API_KEY).
# See docs/instruqt-serverless.md
#
version: "3"

virtualmachines:
  - name: es3-api
    image: elastic/es3-api-v2
    shell: /bin/bash
    environment:
      PROJECT_TYPE: elasticsearch
      OPTIMIZED_FOR: general_purpose
      REGIONS: aws-us-east-1
    memory: 12288
    cpus: 4
    allow_external_ingress:
      - http
      - https
      - high-ports

secrets:
  - name: ESS_CLOUD_API_KEY
